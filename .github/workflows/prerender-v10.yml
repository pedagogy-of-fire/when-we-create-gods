name: Freeze v1.0 to static HTML

on:
  push:
    paths:
      - 'scripts/prerender-v10.mjs'
      - '.github/workflows/prerender-v10.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prerender:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 8080 --directory docs > /tmp/when-we-create-gods-http.log 2>&1 &
          sleep 2

      - name: Render frozen essay
        run: node scripts/prerender-v10.mjs

      - name: Verify static output
        run: |
          grep -F 'A arquitetura do não saber' docs/pt/ensaio-v10.html
          grep -F 'A herança que atravessa substratos' docs/pt/ensaio-v10.html
          grep -F 'app-static.js' docs/pt/ensaio-v10.html
          ! grep -E 'v10-0[1-9].*\.js' docs/pt/ensaio-v10.html

      - name: Commit frozen HTML
        run: |
          if git diff --quiet -- docs/pt/ensaio-v10.html; then
            echo 'No prerender changes to commit.'
            exit 0
          fi
          git config user.name 'pedagogy-of-fire'
          git config user.email 'pedagogy-of-fire@users.noreply.github.com'
          git add docs/pt/ensaio-v10.html
          git commit -m 'Freeze v1.0 essay as static HTML'
          git pull --rebase origin main
          git push origin main
